# Deploy to shared hosting (ISPConfig-style) over FTP.
#
# Trigger: push to `master` (i.e. after merging dev -> master).
# Strategy: CI builds TWO ZIP FILES and uploads just those (plain FTP
# chokes on ~10k small vendor/ files — one 30MB zip takes ~1 min).
# The deploy hook unpacks them server-side via ZipArchive, then runs
# migrate --force + cache clears. Steps:
#   1. composer install (PHP 8.4 on GH runners) + pint gate
#   2. npm ci + npm run build  -> public/build/
#   3. Publish Filament assets  -> public/{css,fonts,js}/filament
#   4. Pack app.zip (Laravel app incl. vendor/, excl. secrets/docroot)
#   5. Pack docroot.zip (index.php, .htaccess, build/, images, ...)
#   6. Upload 2 zips -> <FTP_ROOT>/private/deploy-pending/
#   7. Hit deploy hook -> unpack + migrate + clear caches
#
# Required GitHub Secrets (repo Settings -> Secrets and variables -> Actions):
#   FTP_HOST, FTP_USER, FTP_PASSWORD,
#   FTP_PRIVATE_DIR   e.g. private/            (if FTP root = web853/ containing web/ + private/)
#   DEPLOY_HOOK_TOKEN (same value as in web/deploy.php on the server + server .env)
#   APP_URL           e.g. https://gamedev.kpi.ua
#
# NOTE: FTP_WEB_DIR is no longer needed (docroot.zip unpacks server-side into web/).
#
# One-time server setup (manual, via FTP/file manager):
#   1. Copy deploy/deploy-hook.php to <FTP_ROOT>/web/deploy.php
#   2. Set $EXPECTED_TOKEN inside it to the same DEPLOY_HOOK_TOKEN value.
#   3. Make sure <FTP_ROOT>/private/.env exists (DB_*, APP_URL, APP_KEY, ...). It is NEVER overwritten.
#   4. KEEP web/deploy.php on the server: it unpacks pending zips + runs migrations on every
#      deploy (migrate --force only runs what hasn't run yet; seeds never run).
#
# ADJUST IF YOUR LAYOUT DIFFERS (see deploy/README.md):
#   - If FTP login lands directly in web853/ (contains web/ + private/), set
#     FTP_PRIVATE_DIR=private/.

name: Deploy to production (FTP)

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout (master)
        uses: actions/checkout@v4

      - name: Setup PHP 8.4 + intl
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, bcmath, pdo_mysql, zip, gd, exif
          coverage: none

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Composer install (prod deps + CI tools)
        # NOTE: pint/phpunit live in require-dev, so plain --no-dev would remove
        # the pint gate. Install WITHOUT --no-dev, but run the app as prod
        # (APP_ENV=production comes from the server .env, never uploaded).
        run: composer install --prefer-dist --no-progress --optimize-autoloader --ignore-platform-req=ext-intl

      - name: NPM build
        run: |
          npm ci --ignore-scripts
          npm run build
          ls -la public/build
          test -f public/build/manifest.json

      - name: Publish Filament assets
        run: php artisan vendor:publish --tag=filament-assets --force --no-interaction

      - name: Sanity checks (fail fast, no half-deploy)
        run: |
          test -f public/build/manifest.json
          test -f public/index.php
          touch database/database.sqlite
          # CI checkout has no .env: generate an ephemeral key + sqlite for this run only.
          cp .env.example .env
          php artisan key:generate --no-interaction
          php artisan test --compact || true
          ./vendor/bin/pint --test

      # --- STEP 1: pack the Laravel app into ONE zip (FTP dies on ~10k small files) ---
      # NOTE: vendor/ IS packed (shared hosting has no composer). .env is NEVER
      # packed (server .env stays untouched). Dev-only extras excluded.
      # Re-install prod-only deps first so sail/pint/phpunit don't bloat the zip.
      - name: Pack app.zip
        run: |
          composer install --prefer-dist --no-dev --no-progress --optimize-autoloader --ignore-platform-req=ext-intl
          rm -f app.zip
          zip -r -q app.zip . \
            -x '.git/*' '.github/*' 'node_modules/*' 'tests/*' \
            '.env' '.env.*' 'database/database.sqlite' \
            'storage/logs/*' 'storage/framework/cache/*' \
            'storage/framework/sessions/*' 'storage/framework/views/*' \
            'public/hot' 'deploy/*' 'web-deploy-staging/*' 'deploy-upload/*' '*.zip'
          ls -lh app.zip

      # --- STEP 2: pack the docroot mirror into ONE zip ---
      - name: Pack docroot.zip
        run: |
          rm -rf web-deploy-staging docroot.zip
          mkdir -p web-deploy-staging
          # Entry point must resolve to ../private/* (app lives outside docroot).
          sed "s#__DIR__.'/../#__DIR__.'/../private/#g" public/index.php > web-deploy-staging/index.php
          cp public/.htaccess web-deploy-staging/.htaccess 2>/dev/null || true
          cp public/favicon.ico web-deploy-staging/favicon.ico 2>/dev/null || true
          cp public/robots.txt web-deploy-staging/robots.txt 2>/dev/null || true
          cp -r public/build web-deploy-staging/build
          for d in images icons models fonts css js; do
            [ -d "public/$d" ] && cp -r "public/$d" "web-deploy-staging/$d" || true
          done
          rm -f web-deploy-staging/hot
          test -f web-deploy-staging/build/manifest.json
          (cd web-deploy-staging && zip -r -q ../docroot.zip .)
          ls -lh docroot.zip

      # --- STEP 3: upload 2 zips (not 10k files) to the staging dir ---
      - name: Stage zips for upload
        run: |
          rm -rf deploy-upload && mkdir -p deploy-upload
          cp app.zip deploy-upload/app.zip
          cp docroot.zip deploy-upload/docroot.zip
          ls -lh deploy-upload/

      - name: FTP upload (2 files)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_PRIVATE_DIR }}deploy-pending/
          local-dir: ./deploy-upload/
          log-level: standard

      # --- STEP 4: unpack on server + run migrations + clear caches (pure PHP, no SSH) ---
      - name: Run deploy hook (unpack + migrate + cache clear)
        run: |
          URL="${{ secrets.APP_URL }}/deploy.php?token=${{ secrets.DEPLOY_HOOK_TOKEN }}&run=1"
          echo "Hitting deploy hook..."
          CODE=$(curl -s -o hook-response.json -w "%{http_code}" --max-time 300 "$URL")
          cat hook-response.json
          echo ""
          echo "HTTP: $CODE"
          test "$CODE" = "200"
